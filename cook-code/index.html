<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Code & Cook</title>
  <link rel="stylesheet" href="css/main.css" />
</head>

<body>
  <div id="app">

    <!-- LAYAR UTAMA (besar) -->
    <section id="game-screen">
      <canvas id="game-canvas" width="800" height="600"></canvas>
    </section>

    <!-- LAYAR CODING (kecil) -->
    <section id="code-screen">
      <header class="code-header">
        <h2>🧩 Kode <small id="save-indicator" class="save-indicator"></small></h2>
        <div class="code-buttons">
          <button id="btn-run" class="btn run">▶ RUN</button>
          <button id="btn-stop" class="btn stop">■ STOP</button>
          <button id="btn-clear" class="btn clear" title="Kosongkan area kerja">🗑</button>
          <button id="btn-shop" class="btn shop" title="Toko blok kode">🛒</button>
        </div>
      </header>

      <div id="mission-bar">
        <div class="mission-text">
          <strong id="mission-title">Level 1</strong>
          <span id="mission-goal"></span>
        </div>
        <button id="btn-mission" class="btn mission" title="Misi dan tutorial">📘</button>
      </div>

      <div class="code-body">
        <aside id="palette">
          <h3>Blok</h3>
          <div id="palette-list"></div>
        </aside>

        <div id="workspace">
          <div id="stack"></div>
          <p id="stack-hint" class="stack-hint">Seret blok dari kiri ke bawah <b>Start</b></p>
        </div>
      </div>

      <div id="block-info">
        <strong>Info blok</strong>
        <p>Klik sebuah blok di palette untuk melihat fungsinya.</p>
      </div>

      <div id="status-bar" class="info">Siap.</div>
    </section>

  </div>

  <!-- TOKO BLOK KODE -->
  <div id="shop-modal" class="modal" hidden>
    <div class="modal-card">
      <div class="modal-head">
        <h2>🛒 Toko Blok Kode</h2>
        <span id="shop-money" class="shop-money">💰 0</span>
        <button id="btn-shop-close" class="btn stop">✕</button>
      </div>
      <div id="shop-body" class="modal-body"></div>
    </div>
  </div>

  <!-- MISI DAN TUTORIAL -->
  <div id="mission-modal" class="modal" hidden>
    <div class="modal-card">
      <div class="modal-head">
        <h2>📘 Misi &amp; Tutorial</h2>
        <button id="btn-mission-close" class="btn stop">✕</button>
      </div>
      <div id="mission-body" class="modal-body"></div>
      <div class="modal-foot">
        <button id="btn-garden-reset" class="btn clear">🌱 Kosongkan kebun</button>
        <button id="btn-save-reset" class="btn stop">♻ Reset progres</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>

</html>
